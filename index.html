      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(236, 72, 153, 0.9); }

      @keyframes spotlight {
        0%, 100% { transform: rotate(-18deg) scaleY(1.1); opacity: 0.55; }
        50% { transform: rotate(18deg) scaleY(1.2); opacity: 0.85; }
      }
      @keyframes spotlightReverse {
        0%, 100% { transform: rotate(18deg) scaleY(1.15); opacity: 0.75; }
        50% { transform: rotate(-18deg) scaleY(1.05); opacity: 0.5; }
      }
      .animate-spotlight-1 { animation: spotlight 4s ease-in-out infinite; transform-origin: top center; }
      .animate-spotlight-2 { animation: spotlightReverse 5s ease-in-out infinite; transform-origin: top center; }

      @keyframes popEquip {
        0% { transform: scale(0.94); }
        50% { transform: scale(1.04); }
        100% { transform: scale(1); }

      // ============================================================================

      const CATEGORIES = [
        { id: 'tops', label: 'Camisas', sub: 'Jaquetas & Tops', icon: Shirt, gradient: 'from-pink-500 to-rose-500', border: 'border-pink-300' },
        { id: 'bottoms', label: 'Saias & Calças', sub: 'Shorts & Saias', icon: SkirtIcon, gradient: 'from-cyan-500 to-blue-500', border: 'border-cyan-300' },
        { id: 'shoes', label: 'Botas & Tênis', sub: 'Sapatos K-Pop', icon: BootIcon, gradient: 'from-amber-400 to-orange-500', border: 'border-amber-300' },
        { id: 'hair', label: 'Cabelos', sub: 'Cortes & Cores', icon: Scissors, gradient: 'from-fuchsia-500 to-purple-600', border: 'border-fuchsia-300' },
        { id: 'makeup', label: 'Maquiagem', sub: 'Sombra & Blush', icon: Palette, gradient: 'from-rose-400 to-pink-600', border: 'border-rose-300' },
        { id: 'accessories', label: 'Acessórios', sub: 'Mão & Cabeça', icon: Wand2, gradient: 'from-violet-500 to-indigo-600', border: 'border-violet-300' },
      ];

      function App() {
        const [selectedWarriorId, setSelectedWarriorId] = useState(WARRIORS[0].id);
        const [activeCategory, setActiveCategory] = useState('tops');
        const [showMode, setShowMode] = useState(false);
        const [photoSavedToast, setPhotoSavedToast] = useState(false);
        const [equipAnim, setEquipAnim] = useState(false);

        // Estado do Drag & Drop (Arrastar peça até o corpo)
        const [draggedItem, setDraggedItem] = useState(null);
        // { categoryKey, itemId, name, x, y, startX, startY }
        const [isOverCharacter, setIsOverCharacter] = useState(false);

        const currentWarrior = WARRIORS.find((w) => w.id === selectedWarriorId) || WARRIORS[0];
        const [customState, setCustomState] = useState({ ...WARRIORS[0].defaultState });

        const svgRef = useRef(null);
        const stageDropRef = useRef(null);

        const handleSelectWarrior = (warrior) => {
          setSelectedWarriorId(warrior.id);
          setCustomState({ ...warrior.defaultState });
        };

        const updateItem = (key, value) => {
          setCustomState((prev) => ({ ...prev, [key]: value }));
          setEquipAnim(true);
          setTimeout(() => setEquipAnim(false), 380);
        };

        // Lógica de Arrastar e Soltar no Corpo (Funciona com Mouse e Toque Infantil!)
        const handleStartDrag = (e, categoryKey, itemId, name) => {
          e.preventDefault();
          const clientX = e.clientX ?? (e.touches && e.touches[0]?.clientX) ?? 0;
          const clientY = e.clientY ?? (e.touches && e.touches[0]?.clientY) ?? 0;

          setDraggedItem({
            categoryKey,
            itemId,
            name,
            x: clientX,
            y: clientY,
            startX: clientX,
            startY: clientY,
          });
        };

        useEffect(() => {
          if (!draggedItem) return;

          const checkInsideCharacter = (x, y) => {
            if (!stageDropRef.current) return false;
            const rect = stageDropRef.current.getBoundingClientRect();
            // Margem generosa para facilitar para crianças pequenas
            return (
              x >= rect.left - 35 &&
              x <= rect.right + 35 &&
              y >= rect.top - 35 &&
              y <= rect.bottom + 35
            );
          };

          const handlePointerMove = (e) => {
            const x = e.clientX;
            const y = e.clientY;
            setDraggedItem((prev) => (prev ? { ...prev, x, y } : null));
            setIsOverCharacter(checkInsideCharacter(x, y));
          };

          const handlePointerUp = (e) => {
            const x = e.clientX;
            const y = e.clientY;
            const dist = Math.hypot(x - draggedItem.startX, y - draggedItem.startY);

            // Se a criança arrastou e soltou em cima da personagem OU se apenas clicou na peça, veste a roupa!
            if (checkInsideCharacter(x, y) || dist < 14) {
              updateItem(draggedItem.categoryKey, draggedItem.itemId);
              if (window.confetti && checkInsideCharacter(x, y)) {
                window.confetti({
                  particleCount: 28,
                  spread: 55,
                  origin: { x: x / window.innerWidth, y: y / window.innerHeight },
                  colors: ['#FF499E', '#00F5D4', '#FEE440'],
                });
              }
            }
            setDraggedItem(null);
            setIsOverCharacter(false);
          };

          window.addEventListener('pointermove', handlePointerMove);
          window.addEventListener('pointerup', handlePointerUp);
          return () => {
            window.removeEventListener('pointermove', handlePointerMove);
            window.removeEventListener('pointerup', handlePointerUp);
          };
        }, [draggedItem]);

        const fireShowConfetti = () => {
          if (window.confetti) {
            window.confetti({
              particleCount: 75,
              spread: 80,
              origin: { y: 0.6 },
              colors: ['#FF499E', '#00F5D4', '#FEE440', '#9B5DE5', '#38BDF8'],
            });
          }
        };

        const toggleShowMode = () => {
          const nextState = !showMode;
          setShowMode(nextState);
          if (nextState) fireShowConfetti();
        };

        useEffect(() => {
          if (!showMode) return;
          const interval = setInterval(() => {
            if (window.confetti) {
              window.confetti({ particleCount: 25, angle: 60, spread: 55, origin: { x: 0, y: 0.65 }, colors: ['#FF499E', '#00F5D4', '#FEE440'] });
              window.confetti({ particleCount: 25, angle: 120, spread: 55, origin: { x: 1, y: 0.65 }, colors: ['#9B5DE5', '#38BDF8', '#FEE440'] });
            }
          }, 2800);
          return () => clearInterval(interval);
        }, [showMode]);

        const handleRandomize = () => {
          const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
          setCustomState({
            hairStyle: pick(HAIR_STYLES).id,
            hairColor: pick(HAIR_COLORS).hex,
            eyeshadow: pick(EYESHADOWS.filter((i) => i.id !== 'none')).id,
            blush: pick(BLUSHES).id,
            lipColor: pick(LIP_COLORS).id,
            top: pick(TOPS).id,
            bottom: pick(BOTTOMS).id,
            shoes: pick(SHOES).id,
            headpiece: pick(HEADPIECES.filter((i) => i.id !== 'none')).id,
            handItem: pick(HAND_ITEMS.filter((i) => i.id !== 'none')).id,
            wristItem: pick(WRIST_ITEMS.filter((i) => i.id !== 'none')).id,
          });
          setEquipAnim(true);
          setTimeout(() => setEquipAnim(false), 380);
        };

        const handleReset = () => {
          setCustomState({ ...currentWarrior.defaultState });
          setEquipAnim(true);
          setTimeout(() => setEquipAnim(false), 380);
        };

        const handleSavePhoto = () => {
          if (!svgRef.current) return;
          const svgElement = svgRef.current;
          const serializer = new XMLSerializer();
          let svgString = serializer.serializeToString(svgElement);
          if (!svgString.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
            svgString = svgString.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
          }
          const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(svgBlob);
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 1120;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            const pngUrl = canvas.toDataURL('image/png');
            const downloadLink = document.createElement('a');
            downloadLink.href = pngUrl;
            downloadLink.download = `guerreira-kpop-${currentWarrior.id}.png`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            setPhotoSavedToast(true);
            if (window.confetti) window.confetti({ particleCount: 45, spread: 60, origin: { y: 0.7 } });
            setTimeout(() => setPhotoSavedToast(false), 3200);
          };
          img.src = url;
        };

        const hairColorObj = HAIR_COLORS.find((c) => c.hex === customState.hairColor) || HAIR_COLORS[0];

        // Componente de Card de Roupa Arrastável (Vitrine Infantil)
        const renderDraggableCard = (categoryKey, itemId, title, badgeText, active) => (
          <div
            key={itemId}
            onPointerDown={(e) => handleStartDrag(e, categoryKey, itemId, title)}
            className={`draggable-card group relative flex flex-col items-center justify-between p-3 rounded-3xl border-3 cursor-grab active:cursor-grabbing transition-all duration-200 select-none ${
              active
                ? 'bg-gradient-to-b from-pink-500/30 to-purple-700/40 border-2 border-yellow-300 shadow-[0_0_20px_rgba(253,224,71,0.35)] scale-[1.02]'
                : 'bg-slate-800/80 hover:bg-slate-800 border-2 border-purple-500/30 hover:border-pink-400/70 hover:scale-[1.03]'
            }`}
          >
            {/* Selo de Vestido Atualmente */}
            {active && (
              <span className="absolute top-2 right-2 w-6 h-6 rounded-full bg-yellow-300 text-slate-950 flex items-center justify-center shadow-md z-10">
                <Check className="w-4 h-4" />
              </span>
            )}

            {badgeText && (
              <span className="self-start text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-pink-500/30 text-pink-200 border border-pink-400/30 mb-1">
                {badgeText}
              </span>
            )}

            {/* Desenho grande da Roupa / Item no Cabide */}
            <div className="w-28 h-28 sm:w-32 sm:h-32 bg-slate-950/70 rounded-2xl p-2 flex items-center justify-center border border-white/10 group-hover:border-pink-400/40 transition overflow-hidden">
              <GarmentPreviewSVG
                category={categoryKey}
                itemId={itemId}
                hairColor={hairColorObj.hex}
                hairSecondary={hairColorObj.secondary}
              />
            </div>

            <div className="mt-2 text-center">
              <p className="text-xs sm:text-sm font-bold text-white leading-tight">{title}</p>
              <span className="inline-flex items-center gap-1 text-[11px] text-cyan-300 font-semibold mt-0.5">
                <HandGrab className="w-3 h-3" /> Arraste até ela!
              </span>
            </div>
          </div>
        );

        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-950 via-purple-950 to-slate-950 text-white flex flex-col justify-between relative overflow-hidden">
            {/* PEÇA FLUTUANTE SEGUINDO O DEDO / MOUSE ENQUANTO A CRIANÇA ARRASTA */}
            {draggedItem && (
              <div
                style={{
                  left: draggedItem.x,
                  top: draggedItem.y,
                  transform: 'translate(-50%, -50%) scale(1.15)',
                }}
                className="fixed z-50 pointer-events-none w-36 h-36 rounded-3xl bg-pink-500/30 backdrop-blur-md border-4 border-yellow-300 shadow-[0_0_40px_rgba(236,72,153,0.9)] flex flex-col items-center justify-center p-2"
              >
                <GarmentPreviewSVG
                  category={draggedItem.categoryKey}
                  itemId={draggedItem.itemId}
                  hairColor={hairColorObj.hex}
                  hairSecondary={hairColorObj.secondary}
                />
                <span className="px-2 py-0.5 rounded-full bg-yellow-300 text-slate-950 font-extrabold text-[10px] shadow">
                  Solte na Guerreira! ✨
                </span>
              </div>
            )}

            {showMode && (
              <div className="pointer-events-none fixed inset-0 z-10 overflow-hidden">
                <div className="absolute -top-20 left-1/4 w-72 h-[120vh] bg-gradient-to-b from-pink-500/30 via-fuchsia-500/10 to-transparent blur-2xl animate-spotlight-1" />
                <div className="absolute -top-20 right-1/4 w-72 h-[120vh] bg-gradient-to-b from-cyan-400/30 via-blue-500/10 to-transparent blur-2xl animate-spotlight-2" />
              </div>
            )}

            {/* HEADER BAR */}
            <header className="relative z-20 border-b border-pink-500/30 bg-slate-900/85 backdrop-blur-md px-4 py-2.5 shadow-lg">
              <div className="max-w-[1400px] mx-auto flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-pink-500 via-purple-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-pink-500/30 border-2 border-white/40">
                    <Crown className="w-6 h-6 text-yellow-200 drop-shadow" />
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <h1 className="text-xl md:text-2xl font-bold tracking-wide bg-gradient-to-r from-pink-300 via-yellow-200 to-cyan-300 bg-clip-text text-transparent">
                        Guerreiras K-Pop
                      </h1>
                      <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-400/40">
                        <ShieldCheck className="w-3.5 h-3.5" /> LIVRE
                      </span>
                    </div>
                    <p className="text-xs text-purple-200/80">Escolha uma categoria e arraste as roupas até a boneca!</p>
                  </div>
                </div>

                {/* Seletor das 4 Guerreiras */}
                <div className="flex items-center gap-2 bg-slate-950/80 p-1.5 rounded-2xl border border-purple-500/30">
                  <span className="text-xs font-semibold text-purple-300 px-2 hidden sm:inline">Guerreira:</span>
                  {WARRIORS.map((w) => {
                    const isSelected = w.id === selectedWarriorId;
                    return (
                      <button
                        key={w.id}
                        onClick={() => handleSelectWarrior(w)}
                        className={`flex items-center gap-2 px-3 py-1.5 rounded-xl font-bold text-xs md:text-sm transition-all duration-200 ${
                          isSelected
                            ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white shadow-md shadow-pink-500/30 scale-105 border border-white/60'
                            : 'bg-slate-800/70 text-slate-300 hover:bg-slate-800 hover:text-white'
                        }`}
                      >
                        <span className="w-4 h-4 rounded-full border border-white shadow-sm shrink-0" style={{ backgroundColor: w.skin }} />
                        <span>{w.name.split(' ')[0]}</span>
                      </button>
                    );
                  })}
                </div>

                <div className="flex items-center gap-2.5">
                  <button
                    onClick={toggleShowMode}
                    className={`flex items-center gap-2 px-4 py-2 rounded-2xl font-bold text-sm transition-all duration-300 shadow-lg ${
                      showMode
                        ? 'bg-gradient-to-r from-yellow-400 via-pink-500 to-cyan-400 text-slate-950 scale-105 ring-4 ring-pink-400/50 animate-pulse'
                        : 'bg-gradient-to-r from-fuchsia-600 to-purple-600 hover:from-fuchsia-500 hover:to-purple-500 text-white border border-pink-400/40'
                    }`}
                  >
                    <PartyPopper className="w-4 h-4" />
                    <span>{showMode ? 'Palco Ativo!' : 'Modo Show'}</span>
                  </button>

                  <button
                    onClick={handleSavePhoto}
                    className="flex items-center gap-2 px-4 py-2 rounded-2xl font-bold text-sm bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white shadow-lg shadow-cyan-500/25 border border-cyan-300/40 transition-all active:scale-95"
                  >
                    <Camera className="w-4 h-4" />
                    <span>Salvar Foto</span>
                  </button>
                </div>
              </div>
            </header>

            {photoSavedToast && (
              <div className="fixed top-20 right-6 z-50 flex items-center gap-2 bg-emerald-500 text-slate-950 font-bold px-4 py-2.5 rounded-2xl shadow-2xl border-2 border-white animate-bounce">
                <Check className="w-5 h-5" />
                <span>Foto da sua Guerreira K-Pop salva com sucesso! 📸✨</span>
              </div>
            )}

            {/* ÁREA PRINCIPAL DE JOGO (BONECA À ESQUERDA + BOTÕES DE CATEGORIA + GUARDA-ROUPA ABERTO AO LADO) */}
            <main className="relative z-20 flex-1 max-w-[1400px] w-full mx-auto px-3 py-3 grid grid-cols-1 lg:grid-cols-12 gap-4 items-stretch">
              
              {/* 1. PALCO DA BONECA (ZONA DE SOLTAR AS ROUPAS) - 5 COLUNAS */}
              <div className="lg:col-span-5 flex flex-col items-center justify-center">
                <div
                  ref={stageDropRef}
                  className={`w-full max-w-[410px] rounded-3xl p-3 transition-all duration-300 relative ${
                    isOverCharacter
                      ? 'bg-pink-500/30 border-4 border-yellow-300 shadow-[0_0_55px_rgba(250,204,21,0.75)] scale-[1.02]'
                      : showMode
                      ? 'bg-gradient-to-b from-pink-500/30 via-purple-600/30 to-cyan-500/30 shadow-[0_0_50px_rgba(236,72,153,0.45)] border-2 border-pink-400'
                      : 'bg-slate-900/75 shadow-2xl border-2 border-purple-500/30'
                  }`}
                >
                  {/* Topo do Card da Personagem */}
                  <div className="flex items-center justify-between px-3 pb-2">
                    <div className="flex items-center gap-2">
                      <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-pink-500/20 text-pink-300 border border-pink-400/30 flex items-center gap-1">
                        <Star className="w-3 h-3" />
                        {currentWarrior.badge}
                      </span>
                      <span className="text-xs text-purple-200/90 font-medium">{currentWarrior.title}</span>
                    </div>
                    {isOverCharacter ? (
                      <span className="px-2.5 py-0.5 rounded-full bg-yellow-300 text-slate-950 font-extrabold text-xs animate-bounce">
                        SOLTE AQUI! ✨
                      </span>
                    ) : showMode ? (
                      <span className="flex items-center gap-1 text-xs font-bold text-yellow-300 animate-bounce">
                        <Music className="w-3.5 h-3.5" /> AO VIVO
                      </span>
                    ) : null}
                  </div>

                  {/* Canvas SVG da Guerreira */}
                  <div className="w-full aspect-[400/560] rounded-2xl overflow-hidden relative">
                    <WarriorCanvas
                      svgRef={svgRef}
                      warrior={currentWarrior}
                      state={customState}
                      showMode={showMode}
                      isDragOverCharacter={isOverCharacter}
                      equipAnim={equipAnim}
                    />
                  </div>

                  {/* Botões Rápidos */}
                  <div className="mt-3 flex items-center justify-between gap-2 px-1">
                    <button
                      onClick={handleRandomize}
                      className="flex-1 flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-2xl bg-gradient-to-r from-purple-700 to-pink-600 hover:from-purple-600 hover:to-pink-500 text-white text-xs sm:text-sm font-bold border border-pink-300/40 shadow-md transition"
                    >
                      <Shuffle className="w-4 h-4 text-yellow-200" />
                      <span>Look Surpresa</span>
                    </button>
                    <button
                      onClick={handleReset}
                      className="flex items-center justify-center gap-1.5 py-2.5 px-4 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-bold border border-slate-600 transition"
                    >
                      <RotateCcw className="w-4 h-4 text-cyan-300" />
                      <span>Original</span>
                    </button>
                  </div>
                </div>
              </div>

              {/* 2. COLUNA DE BOTÕES DE CATEGORIA + ARMÁRIO VISUAL AO LADO - 7 COLUNAS */}
              <div className="lg:col-span-7 flex flex-col sm:flex-row gap-3 h-full max-h-[650px]">
                
                {/* MENU DE BOTÕES GRANDES (Camisas, Saias, Botas, Cabelos, Maquiagem, Acessórios) */}
                <div className="sm:w-48 flex sm:flex-col gap-2 overflow-x-auto sm:overflow-visible pb-1 sm:pb-0 shrink-0">
                  {CATEGORIES.map((cat) => {
                    const Icon = cat.icon;
                    const isActive = activeCategory === cat.id;
                    return (
                      <button
                        key={cat.id}
                        onClick={() => setActiveCategory(cat.id)}
                        className={`flex items-center gap-3 p-3.5 rounded-3xl font-bold text-left transition-all duration-200 shrink-0 sm:w-full border-2 ${
                          isActive
                            ? `bg-gradient-to-r ${cat.gradient} text-white ${cat.border} shadow-xl scale-[1.03]`
                            : 'bg-slate-900/90 text-slate-300 border-purple-500/20 hover:bg-slate-800 hover:text-white'
                        }`}
                      >
                        <div className={`w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 ${
                          isActive ? 'bg-white/25 text-white' : 'bg-slate-800 text-pink-300'
                        }`}>
                          <Icon className="w-6 h-6" />
                        </div>
                        <div>
                          <div className="text-sm sm:text-base font-extrabold leading-tight">{cat.label}</div>
                          <div className={`text-[11px] font-medium ${isActive ? 'text-white/90' : 'text-slate-400'}`}>
                            {cat.sub}
                          </div>
                        </div>
                      </button>
                    );
                  })}
                </div>

                {/* GAVETA / VITRINE DO GUARDA-ROUPA QUE ABRE AO LADO COM AS ROUPAS PARA ARRASTAR */}
                <div className="flex-1 bg-slate-900/90 backdrop-blur-xl rounded-3xl border-2 border-purple-500/35 shadow-2xl flex flex-col overflow-hidden">
                  
                  {/* Faixa Explicativa Infantil no Topo do Armário */}
                  <div className="px-5 py-3.5 bg-slate-950/80 border-b border-purple-500/30 flex items-center justify-between gap-2">
                    <div className="flex items-center gap-2">
                      <Sparkles className="w-5 h-5 text-yellow-300 shrink-0" />
                      <h2 className="text-base sm:text-lg font-extrabold text-white">
                        {CATEGORIES.find((c) => c.id === activeCategory)?.label}
                      </h2>
                    </div>
                    {activeCategory !== 'makeup' && (
                      <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-pink-500/20 border border-pink-400/40 text-pink-200 text-xs font-bold">
                        <HandGrab className="w-3.5 h-3.5 text-yellow-300" />
                        Arraste a peça até a Guerreira!
                      </span>
                    )}
                  </div>

                  {/* Grade de Peças do Menu Selecionado */}
                  <div className="p-4 sm:p-5 overflow-y-auto custom-scrollbar flex-1">
                    
                    {/* ==========================================
                        MENU 1: CAMISAS, TOPS & JAQUETAS (ARRASTÁVEIS)
                       ========================================== */}
                    {activeCategory === 'tops' && (
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3.5">
                        {TOPS.map((item) =>
                          renderDraggableCard('top', item.id, item.name, item.badge, customState.top === item.id)
                        )}
                      </div>
                    )}

                    {/* ==========================================
                        MENU 2: SAIAS, CALÇAS & SHORTS (ARRASTÁVEIS)
                       ========================================== */}
                    {activeCategory === 'bottoms' && (
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3.5">
                        {BOTTOMS.map((item) =>
                          renderDraggableCard('bottom', item.id, item.name, item.badge, customState.bottom === item.id)
                        )}
                      </div>
                    )}

                    {/* ==========================================
                        MENU 3: BOTAS & TÊNIS (ARRASTÁVEIS)
                       ========================================== */}
                    {activeCategory === 'shoes' && (
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3.5">
                        {SHOES.map((item) =>
                          renderDraggableCard('shoes', item.id, item.name, 'K-BOOT', customState.shoes === item.id)
                        )}
                      </div>
                    )}

                    {/* ==========================================
                        MENU 4: CABELOS (CORTES ARRASTÁVEIS + TINTURAS)
                       ========================================== */}
                    {activeCategory === 'hair' && (
                      <div className="space-y-6">
                        <div>
                          <h3 className="text-xs font-extrabold uppercase tracking-wider text-pink-300 mb-3 flex items-center gap-1.5">
                            <Scissors className="w-4 h-4" /> Arraste o Penteado até a Guerreira:
                          </h3>
                          <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            {HAIR_STYLES.map((style) =>
                              renderDraggableCard('hairStyle', style.id, style.name, 'IDOL HAIR', customState.hairStyle === style.id)
                            )}
                          </div>
                        </div>

                        <div>
                          <h3 className="text-xs font-extrabold uppercase tracking-wider text-cyan-300 mb-3 flex items-center gap-1.5">
                            <Palette className="w-4 h-4" /> Escolha a Cor do Cabelo:
                          </h3>
                          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                            {HAIR_COLORS.map((color) => {
                              const active = customState.hairColor === color.hex;
                              return (
                                <button
                                  key={color.id}
                                  onClick={() => updateItem('hairColor', color.hex)}
                                  className={`flex items-center gap-2.5 p-2.5 rounded-2xl border-2 transition-all ${
                                    active
                                      ? 'bg-slate-800 border-yellow-300 shadow-lg scale-105'
                                      : 'bg-slate-950/70 border-slate-700/80 hover:border-pink-400'
                                  }`}
                                >
                                  <span
                                    className="w-7 h-7 rounded-full border-2 border-white shadow-inner shrink-0"
                                    style={{ backgroundColor: color.hex }}
                                  />
                                  <span className="text-xs font-bold text-white text-left leading-tight">
                                    {color.name}
                                  </span>
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    )}

                    {/* ==========================================
                        MENU 5: MAQUIAGEM (MANTIDO NO ESTILO DE BOTÕES DIRETOS!)
                       ========================================== */}
                    {activeCategory === 'makeup' && (
                      <div className="space-y-6">
                        <div>
                          <h3 className="text-sm font-bold uppercase tracking-wider text-purple-300 flex items-center gap-2 mb-3">
                            <Sparkles className="w-4 h-4" /> Sombra Cintilante de Palco
                          </h3>
                          <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            {EYESHADOWS.map((shadow) => {
                              const active = customState.eyeshadow === shadow.id;
                              return (
                                <button
                                  key={shadow.id}
                                  onClick={() => updateItem('eyeshadow', shadow.id)}
                                  className={`flex items-center gap-3 p-3 rounded-2xl border-2 transition-all ${
                                    active
                                      ? 'bg-purple-500/25 border-yellow-300 shadow-md scale-[1.02]'
                                      : 'bg-slate-800/60 border-slate-700/70 hover:bg-slate-800'
                                  }`}
                                >
                                  <span
                                    className="w-7 h-7 rounded-full border-2 border-white flex items-center justify-center shrink-0"
                                    style={{ backgroundColor: shadow.color === 'transparent' ? '#334155' : shadow.color }}
                                  >
                                    {shadow.shimmer && <span className="text-[10px]">✨</span>}
                                  </span>
                                  <span className="text-xs font-bold text-white text-left">{shadow.name}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>

                        <div>
                          <h3 className="text-sm font-bold uppercase tracking-wider text-pink-300 flex items-center gap-2 mb-3">
                            <Heart className="w-4 h-4" /> Blush Fofo & Glitter Facial
                          </h3>
                          <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            {BLUSHES.map((blush) => {
                              const active = customState.blush === blush.id;
                              return (
                                <button
                                  key={blush.id}
                                  onClick={() => updateItem('blush', blush.id)}
                                  className={`flex items-center gap-3 p-3 rounded-2xl border-2 transition-all ${
                                    active
                                      ? 'bg-pink-500/25 border-yellow-300 shadow-md scale-[1.02]'
                                      : 'bg-slate-800/60 border-slate-700/70 hover:bg-slate-800'
                                  }`}
                                >
                                  <span className="w-7 h-7 rounded-full border-2 border-white shrink-0" style={{ backgroundColor: blush.color }} />
                                  <span className="text-xs font-bold text-white text-left">{blush.name}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>

                        <div>
                          <h3 className="text-sm font-bold uppercase tracking-wider text-rose-300 flex items-center gap-2 mb-3">
                            <Palette className="w-4 h-4" /> Gloss Labial K-Pop
                          </h3>
                          <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            {LIP_COLORS.map((lip) => {
                              const active = customState.lipColor === lip.id;
                              return (
                                <button
                                  key={lip.id}
                                  onClick={() => updateItem('lipColor', lip.id)}
                                  className={`flex items-center gap-3 p-3 rounded-2xl border-2 transition-all ${
                                    active
                                      ? 'bg-rose-500/25 border-yellow-300 shadow-md scale-[1.02]'
                                      : 'bg-slate-800/60 border-slate-700/70 hover:bg-slate-800'
                                  }`}
                                >
                                  <span className="w-7 h-7 rounded-full border-2 border-white shrink-0" style={{ backgroundColor: lip.color }} />
                                  <span className="text-xs font-bold text-white text-left">{lip.name}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    )}

                    {/* ==========================================
                        MENU 6: ACESSÓRIOS ARRASTÁVEIS (VARINHAS, TIARAS, PULSEIRAS)
                       ========================================== */}
                    {activeCategory === 'accessories' && (
                      <div className="space-y-6">
                        <div>
                          <h3 className="text-xs font-extrabold uppercase tracking-wider text-pink-300 mb-3">
                            ✨ Varinhas de Luz (Lightsticks) & Microfones
                          </h3>
                          <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            {HAND_ITEMS.map((item) =>
                              renderDraggableCard('handItem', item.id, item.name, 'MÃO', customState.handItem === item.id)
                            )}
                          </div>
                        </div>

                        <div>
                          <h3 className="text-xs font-extrabold uppercase tracking-wider text-amber-300 mb-3">
                            👑 Tiaras, Visores & Headphones
                          </h3>
                          <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            {HEADPIECES.map((item) =>
                              renderDraggableCard('headpiece', item.id, item.name, 'CABEÇA', customState.headpiece === item.id)
                            )}
                          </div>
                        </div>

                        <div>
                          <h3 className="text-xs font-extrabold uppercase tracking-wider text-cyan-300 mb-3">
                            ⚡ Braceletes & Munhequeiras Neon
                          </h3>
                          <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            {WRIST_ITEMS.map((item) =>
                              renderDraggableCard('wristItem', item.id, item.name, 'PULSO', customState.wristItem === item.id)
                            )}
                          </div>
                        </div>
                      </div>
                    )}

                  </div>
                </div>
              </div>
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
